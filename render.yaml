services:
  - type: web
    name: college-placement-guide
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && node scripts/init-storage.js && node scripts/seed-demo-data.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-001
